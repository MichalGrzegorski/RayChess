# Project configuration: package metadata, pinned dependencies, build settings.

# How to build and install the package (used by "pip install -e .").
[build-system]
requires = ["setuptools>=77"] 
build-backend = "setuptools.build_meta"

# Package metadata.
[project]
name = "raychess"
version = "0.0.1"
description = "NNUE Chess Engine"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numba==0.68.1",
    "numpy==2.5.4",
]

# Extra dependencies, installed with: pip install -e ".[train]"
[project.optional-dependencies]
train = ["torch==2.15.0"]

# List the package explicitly instead of relying on automatic discovery.
[tool.setuptools]
packages = ["raychess"]